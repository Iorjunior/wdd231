<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Câmara de Comércio de Alagoas">
  <rect width="64" height="64" rx="8" fill="#1a3a5c"/>
  <!-- Prédio da câmara (colunas) -->
  <rect x="10" y="38" width="44" height="18" fill="#00b4d8"/>
  <rect x="10" y="34" width="44" height="6" fill="#0077b6"/>
  <!-- Telhado / pedimento -->
  <polygon points="7,34 32,14 57,34" fill="#caf0f8"/>
  <!-- Colunas -->
  <rect x="15" y="38" width="5" height="18" fill="#1a3a5c"/>
  <rect x="25" y="38" width="5" height="18" fill="#1a3a5c"/>
  <rect x="35" y="38" width="5" height="18" fill="#1a3a5c"/>
  <rect x="45" y="38" width="5" height="18" fill="#1a3a5c"/>
  <!-- Porta central -->
  <rect x="27" y="46" width="10" height="10" rx="5" fill="#1a3a5c"/>
  <!-- Estrela de AL (simplificada) -->
  <circle cx="32" cy="26" r="4" fill="#f4a500"/>
</svg>
